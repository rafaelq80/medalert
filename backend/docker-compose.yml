version: "3.8"

services:
  db:
    image: postgres:15
    container_name: medalert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medalert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalert123}
      POSTGRES_DB: ${POSTGRES_DB:-medalert}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medalert}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: medalert-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medalert}:${POSTGRES_PASSWORD:-medalert123}@db:5432/${POSTGRES_DB:-medalert}
    volumes:
      - .:/app

volumes:
  pgdata:
